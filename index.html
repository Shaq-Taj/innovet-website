<style>
/* ============================================================
   CONCEPT 07 — CHALLENGE COIN (light edition)
   A struck coin on a pale studio table. Red, white and blue.
   Deliberately single-theme (light), every colour set explicitly.
   ============================================================ */

:root{
  color-scheme: light;

  /* ---- palette ---- */
  --navy:       #14245C;   /* headings, logo */
  --ink:        #2B3550;   /* body text */
  --muted:      #5B6680;   /* secondary text */
  --red:        #B22234;   /* primary actions, eyebrows */
  --red-deep:   #941B2B;
  --blue:       #2E4E8C;   /* secondary actions */
  --white:      #FFFFFF;
  --mist:       #F4F7FC;   /* section tint 1 */
  --sky:        #EAF0FA;   /* section tint 2 */
  --blush:      #FBEDEF;   /* section tint 3 */
  --line:       #DCE4F0;   /* card borders */
  --line-soft:  #E8EDF6;
  --nickel:     #C9D3E6;
  --shadow:     0 1px 2px rgba(20,36,92,.06), 0 14px 32px -20px rgba(20,36,92,.28);
  --shadow-hi:  0 1px 2px rgba(20,36,92,.08), 0 22px 44px -22px rgba(20,36,92,.36);

  /* ---- the single raking key light (screen %, moved by pointer) ---- */
  --lx: 22%;
  --ly: 6%;

  /* ---- type scale ---- */
  --t-label: 12px;
  --t-micro: 13px;
  --t-small: 16px;
  --t-body:  17px;
  --t-lede:  clamp(18px, 1.35vw, 21px);
  --t-h3:    clamp(20px, 2.1vw, 25px);
  --t-h2:    clamp(30px, 4.4vw, 50px);
  --t-h1:    clamp(36px, 6.2vw, 76px);

  /* ---- spacing scale ---- */
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px; --s5: 24px;
  --s6: 32px; --s7: 48px; --s8: 64px; --s9: 96px; --s10: 132px;

  --gutter: clamp(16px, 4.2vw, 56px);
  --maxw: 1240px;

  /* ---- easing ---- */
  --strike: cubic-bezier(.16,.84,.26,1);
  --settle: cubic-bezier(.22,1.02,.36,1);
  --d-fast: 240ms;

  --radius: 4px;
}

*,*::before,*::after{ box-sizing:border-box; }

html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; background:var(--mist); }

body{
  margin:0;
  background:
    radial-gradient(90% 60% at 72% 18%, #FFFFFF 0%, rgba(255,255,255,0) 60%),
    linear-gradient(180deg, #F4F7FC 0%, #EEF3FB 100%);
  background-color: var(--mist);
  color: var(--ink);
  font-family:"Libre Franklin", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: var(--t-body);
  line-height:1.62;
  letter-spacing:.006em;
  overflow-x:hidden;
  min-height:100%;
}

::selection{ background: var(--red); color:#fff; }

h1,h2,h3,h4{
  font-family:"Zilla Slab", Georgia, serif;
  font-weight:700;
  line-height:1.08;
  letter-spacing:-.012em;
  margin:0;
  color:var(--navy);
  text-wrap:balance;
}
p{ margin:0; }
a{ color:inherit; }

:focus-visible{
  outline:2px solid var(--blue);
  outline-offset:3px;
  border-radius:2px;
}
.btn--red:focus-visible{ outline-color:var(--navy); }

/* skip link: first focusable element, visible on focus */
.skip{
  position:fixed; left:var(--s4); top:calc(env(safe-area-inset-top, 0px) + 10px); z-index:100;
  transform:translateY(-200%);
  background:var(--navy); color:#FFFFFF; font-weight:700; font-size:15px;
  padding:10px 16px; border-radius:var(--radius); text-decoration:none;
}
.skip:focus, .skip:focus-visible{ transform:none; outline:2px solid var(--red); outline-offset:2px; }
main:focus{ outline:none; }
.sr{ position:absolute !important; width:1px; height:1px; margin:-1px; padding:0; border:0; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; }

/* ============ layers ============ */
#coin-layer{
  position:fixed; inset:0; width:100%; height:100%;
  pointer-events:none; z-index:0;
}
.page{ position:relative; z-index:4; }

/* ============ shared object surfaces ============ */

/* a struck plate, now in white: light border, soft shadow, a reeded top edge */
.plate{
  position:relative;
  border-radius:var(--radius);
  background:linear-gradient(180deg, #FFFFFF 0%, #FBFCFE 100%);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
}
.catch{ overflow:hidden; transition:box-shadow 260ms var(--settle), border-color 260ms linear; }
.catch::after{
  content:""; position:absolute; inset:0; border-radius:inherit;
  pointer-events:none;
  background:linear-gradient(104deg,
    rgba(255,255,255,0) 34%,
    rgba(46,78,140,.06) 47%,
    rgba(255,255,255,0) 60%);
  transform:translateX(-118%);
  opacity:0;
  transition:transform 900ms var(--strike), opacity 260ms linear;
}
.catch:hover::after, .catch:focus-within::after{ transform:translateX(118%); opacity:1; }
.catch:hover, .catch:focus-within{ box-shadow:var(--shadow-hi); border-color:#C9D4E8; }

/* reeded coin edge, in pale steel */
.knurl{
  height:6px; border-radius:var(--radius) var(--radius) 0 0;
  background-image:repeating-linear-gradient(90deg, #C9D4E8 0px, #C9D4E8 1px, #F1F4FA 1px, #F1F4FA 3px);
  border-bottom:1px solid var(--line);
}
/* red / white / blue ribbon */
.tri{
  height:4px; border-radius:var(--radius) var(--radius) 0 0;
  background:linear-gradient(90deg, var(--red) 0 33.3%, #FFFFFF 33.3% 66.6%, var(--blue) 66.6% 100%);
  border-bottom:1px solid var(--line);
}

/* ============ typography roles ============ */
.label{
  font-family:"Libre Franklin", sans-serif;
  font-size:var(--t-label);
  font-weight:700;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--muted);
  margin:0;
}
.label--red{ color:var(--red); }
.lede{ font-size:var(--t-lede); line-height:1.62; color:var(--ink); max-width:62ch; }
.body{ font-size:var(--t-body); color:var(--ink); }
.micro{ font-size:var(--t-micro); color:var(--muted); letter-spacing:.02em; }

/* ============ section rhythm ============ */
.section{ padding-block: clamp(72px, 9vw, 128px); position:relative; scroll-margin-top: 76px; }
.bg-white{ background:var(--white); }
.bg-mist{ background:var(--mist); }
.bg-sky{ background:var(--sky); }
.bg-blush{ background:var(--blush); }
.section + .section{ border-top:1px solid var(--line-soft); }
.hero{ scroll-margin-top: 0; }
.wrap{ width:100%; max-width:var(--maxw); margin:0 auto; padding-inline: var(--gutter); }
.sechead{ margin-bottom: var(--s7); max-width: 74ch; }
.sechead .label{ margin-bottom: var(--s4); }
.sechead h2{ font-size:var(--t-h2); margin-bottom: var(--s5); }

.seam{ height:1px; width:100%; background:linear-gradient(90deg, rgba(46,78,140,0), rgba(46,78,140,.28) 18%, rgba(46,78,140,.28) 82%, rgba(46,78,140,0)); }

/* ============ NAV ============ */
.nav{
  position:fixed; left:0; right:0;
  top: env(safe-area-inset-top, 0px);
  z-index:40;
  backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  background:rgba(255,255,255,.9);
  border-bottom:1px solid var(--line);
  box-shadow:0 10px 24px -22px rgba(20,36,92,.5);
}
.nav-in{
  max-width:var(--maxw); margin:0 auto; padding-inline:var(--gutter);
  height:68px; display:flex; align-items:center; gap:var(--s4);
}
.iv-logo{ height:24px; width:auto; display:block; color:var(--navy); }
.brandlink{ display:flex; align-items:center; text-decoration:none; padding:6px 2px; flex:none; }
.nav-sp{ flex:1; }
.nav-links{ display:flex; align-items:center; gap:0; }
.nav-a{
  font-size:12.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--navy); text-decoration:none; padding:9px 10px; border-radius:2px;
  position:relative; transition:color var(--d-fast) var(--settle); white-space:nowrap;
}
.nav-a::after{
  content:""; position:absolute; left:10px; right:10px; bottom:4px; height:2px;
  background:var(--red);
  transform:scaleX(0); transform-origin:50% 50%;
  transition:transform 380ms var(--strike);
}
.nav-a:hover{ color:var(--red); }
.nav-a:hover::after{ transform:scaleX(1); }
.nav-a[aria-current="page"]{ color:var(--red); }
.nav-a[aria-current="page"]::after{ transform:scaleX(1); }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:9px;
  font-family:"Libre Franklin", sans-serif;
  font-size:var(--t-micro); font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  padding:12px 20px; border-radius:var(--radius); text-decoration:none;
  border:1px solid transparent; cursor:pointer; white-space:nowrap;
  position:relative; overflow:hidden;
  transition:transform 200ms var(--settle), box-shadow 240ms var(--settle), background-color 240ms linear;
}
.btn::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(102deg, rgba(255,255,255,0) 36%, rgba(255,255,255,.32) 50%, rgba(255,255,255,0) 64%);
  transform:translateX(-120%); transition:transform 780ms var(--strike);
}
.btn:hover::after{ transform:translateX(120%); }
.btn:active{ transform:translateY(1px); }
.btn--red{
  color:#FFFFFF;
  background:linear-gradient(180deg, #C02A3D 0%, #A51F31 100%);
  border-color:#941B2B;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 10px 20px -12px rgba(178,34,52,.7);
}
.btn--red:hover{ box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 14px 24px -12px rgba(178,34,52,.8); }
.btn--blue{
  color:var(--blue);
  background:#FFFFFF;
  border-color:#B9C7E0;
  box-shadow:0 8px 18px -14px rgba(20,36,92,.5);
}
.btn--blue:hover{ background:#F4F7FC; border-color:var(--blue); }
.btn--lg{ padding:15px 24px; }

.burger{
  display:none; width:44px; height:40px; align-items:center; justify-content:center; flex-direction:column;
  background:#FFFFFF; border:1px solid var(--line); border-radius:var(--radius); cursor:pointer;
  box-shadow:0 6px 14px -10px rgba(20,36,92,.5);
}
.burger span{ display:block; width:18px; height:2px; background:var(--navy); margin:2.5px 0; border-radius:1px; transition:transform 300ms var(--strike), opacity 200ms; }
.burger[aria-expanded="true"] span:nth-child(1){ transform:translateY(4.5px) rotate(45deg); }
.burger[aria-expanded="true"] span:nth-child(2){ opacity:0; }
.burger[aria-expanded="true"] span:nth-child(3){ transform:translateY(-4.5px) rotate(-45deg); }

.drawer{ display:none; overflow:hidden; border-top:1px solid var(--line-soft); background:#FFFFFF; }
.drawer-in{ padding: var(--s3) var(--gutter) var(--s6); display:flex; flex-direction:column; }
.drawer-a{
  display:block; text-decoration:none; color:var(--navy);
  font-size:15px; font-weight:600; letter-spacing:.11em; text-transform:uppercase;
  padding:13px 2px; border-bottom:1px solid var(--line-soft);
}
.drawer-a:hover{ color:var(--red); }
.drawer .btn{ margin-top:var(--s5); }

/* ============ HERO ============ */
.hero{
  position:relative;
  padding-top: clamp(118px, 15vh, 168px);
  padding-bottom: clamp(64px, 9vh, 120px);
  min-height: 88vh;
  display:flex; align-items:center;
}
.hero-grid{
  display:grid; grid-template-columns: minmax(0,1.04fr) minmax(0,.96fr);
  gap: var(--s8); align-items:center; width:100%;
}
.hero-plate{ padding: 0; background:rgba(255,255,255,.94); box-shadow:var(--shadow-hi); }
.hero-plate-in{ padding: clamp(24px, 3.2vw, 44px); }
.hero h1{ font-size:var(--t-h1); margin: var(--s5) 0; }
.hero h1 .cut{
  color:var(--blue);
  background:linear-gradient(174deg, #2E4E8C 0%, #14245C 100%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
}
.hero .lede{ margin-bottom: var(--s6); }
.cta-row{ display:flex; flex-wrap:wrap; gap:var(--s3); }
.hero-meta{ display:flex; flex-wrap:wrap; gap:var(--s5); margin-top:var(--s6); padding-top:var(--s5); border-top:1px solid var(--line); }
.hero-meta > div{ min-width:0; }

/* the coin stage — transparent, holds the drag affordance over the WebGL coin */
.stage{ position:relative; min-height: clamp(300px, 46vh, 520px); display:flex; align-items:center; justify-content:center; }
.spin{
  width: clamp(230px, 26vw, 330px); height: clamp(230px, 26vw, 330px);
  border-radius:50%; background:transparent; border:1px dashed rgba(46,78,140,.7);
  cursor:grab; touch-action:pan-y; padding:0; position:relative;
  display:flex; align-items:flex-end; justify-content:center;
  transition:border-color 300ms linear;
}
.spin:hover{ border-color:var(--blue); }
.spin:active{ cursor:grabbing; }
.spin-hint{
  position:absolute; left:50%; top:calc(100% + 14px); transform:translateX(-50%); white-space:nowrap;
  font-size:var(--t-label); font-weight:700; letter-spacing:.2em; text-transform:uppercase;
  color:var(--navy); background:rgba(255,255,255,.9); padding:6px 11px; border-radius:2px;
  border:1px solid var(--line); box-shadow:0 6px 14px -10px rgba(20,36,92,.5);
  animation: breathe 2.2s ease-in-out 2; /* finite: stops well inside 5s (WCAG 2.2.2) */
}
@keyframes breathe{ 0%,100%{opacity:.7} 50%{opacity:1} }

.strike-in{ animation: strikeIn 900ms var(--strike) both; }
@keyframes strikeIn{
  0%{ transform:translateY(14px) scale(.995); opacity:.9; filter:blur(1px); }
  62%{ transform:translateY(-3px) scale(1.002); opacity:1; filter:blur(0); }
  82%{ transform:translateY(1px) scale(.9995); }
  100%{ transform:none; opacity:1; filter:blur(0); }
}
.d1{ animation-delay:60ms; } .d3{ animation-delay:250ms; }

/* ============ overview ============ */
.ov-grid{ display:grid; grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr); gap:var(--s8); align-items:start; }
.ov-grid h2{ font-size:var(--t-h2); margin-top:var(--s4); }
.ov-grid .lede + .lede{ margin-top:var(--s5); }

.star{ width:16px; height:16px; flex:none; display:block; }
.star polygon{ fill:var(--red); }

/* ============ capability teaser ============ */
.cap-grid{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:var(--s4); }
.cap{ display:flex; gap:var(--s4); align-items:flex-start; padding: var(--s5); text-decoration:none; color:inherit; transition:transform 260ms var(--settle); }
.cap:hover{ transform:translateY(-2px); }
.cap h3{ font-size:19px; margin-bottom:4px; }
.cap p{ font-size:15px; color:var(--ink); line-height:1.5; }
.cap-icon{ width:40px; height:40px; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--sky); border:1px solid #C9D4E8; color:var(--blue); }
.cap-icon svg{ width:20px; height:20px; display:block; }
.more{ margin-top:var(--s6); }

/* ============ how it works ============ */
/* ============ how it works ============ */
.steps{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:var(--s5); counter-reset:step; position:relative; }
.steps::before{ content:""; position:absolute; left:28px; right:28px; top:27px; height:2px; background:repeating-linear-gradient(90deg, #C9D4E8 0 6px, transparent 6px 11px); }
.step{ position:relative; min-width:0; }
.step-n{
  width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:"Zilla Slab", serif; font-weight:700; font-size:24px; color:var(--navy);
  background:radial-gradient(circle at 35% 30%, #FFFFFF 0%, #EEF2F9 60%, #DCE4F0 100%);
  border:2px solid #C9D4E8; box-shadow:0 0 0 4px #FFFFFF, 0 8px 18px -12px rgba(20,36,92,.6);
  position:relative; margin-bottom:var(--s5);
}
.step:first-child .step-n{ border-color:var(--red); color:var(--red); }
.step h3{ font-size:20px; margin-bottom:var(--s2); }
.step p{ font-size:var(--t-small); color:var(--ink); }

/* ============ closing band ============ */
.band{ padding:0; }
.band-in{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:var(--s5); padding: clamp(24px, 3.4vw, 44px); }
.band-in h2{ font-size:clamp(24px, 2.8vw, 34px); margin-bottom:var(--s2); }


/* ============ FOOTER ============ */
.footer{ position:relative; z-index:4; border-top:1px solid var(--line); padding-block: var(--s8) var(--s6); background:var(--sky); }
.foot-grid{ display:grid; grid-template-columns: 1.3fr 1fr 1fr; gap:var(--s7); }
.foot-nav{ display:flex; flex-direction:column; gap:var(--s3); }
.foot-nav a, .foot-contact a{ text-decoration:none; color:var(--ink); font-size:var(--t-small); transition:color 200ms; }
.foot-nav a:hover, .foot-contact a:hover{ color:var(--red); }
.foot-bottom{ margin-top:var(--s7); padding-top:var(--s5); border-top:1px solid #D3DCEC; display:flex; flex-wrap:wrap; gap:var(--s4); justify-content:space-between; align-items:center; }

/* ============ reveal: always fully opaque; only a small settle movement ============ */
.rv{ transform:translateY(14px); transition:transform 820ms var(--strike); }
.rv.on{ transform:none; }

/* ============ responsive ============ */
@media (max-width: 1180px){
  .nav-links, .nav-in > .btn{ display:none; }
  .burger{ display:flex; }
  .drawer{ display:block; }
}
@media (max-width: 1040px){
  .foot-grid{ grid-template-columns:1fr 1fr; }

<script>
(function(){
"use strict";
var html = htm.bind(React.createElement);
var useState = React.useState, useEffect = React.useEffect, useRef = React.useRef;

var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ------------------------------------------------------------------
   shared scroll store — one listener, rAF throttled
------------------------------------------------------------------ */
var Scroll = (function(){
  var y = window.pageYOffset || 0, last = y, dir = 1, ticking = false;
  var subs = [];
  function read(){ return window.pageYOffset || document.documentElement.scrollTop || 0; }
  function emit(){
    ticking = false;
    var ny = read();
    if (ny > last + 0.5) dir = 1; else if (ny < last - 0.5) dir = -1;
    last = ny; y = ny;
    for (var i=0;i<subs.length;i++){ try{ subs[i](y, dir); }catch(e){} }
  }
  function onEvt(){ if(!ticking){ ticking = true; requestAnimationFrame(emit); } }
  window.addEventListener('scroll', onEvt, {passive:true});
  window.addEventListener('resize', onEvt, {passive:true});
  return {
    sub:function(f){ subs.push(f); f(y,dir); return function(){ var i=subs.indexOf(f); if(i>=0) subs.splice(i,1); }; },
    get y(){ return y; }, get dir(){ return dir; }
  };
})();

/* ------------------------------------------------------------------
   the one light — pointer moves the coin's key light
------------------------------------------------------------------ */
var Light = { x: 0.22, y: 0.10 };
(function(){
  if (REDUCED) return;
  var pending = false, px = 0.22, py = 0.10;
  function apply(){
    pending = false;
    Light.x = px; Light.y = py;
    document.documentElement.style.setProperty('--lx', (px*100).toFixed(1) + '%');
    document.documentElement.style.setProperty('--ly', (py*100).toFixed(1) + '%');
  }
  window.addEventListener('pointermove', function(e){
    if (e.pointerType === 'touch') return;
    px = e.clientX / Math.max(1, window.innerWidth);
    py = e.clientY / Math.max(1, window.innerHeight);
    if (!pending){ pending = true; requestAnimationFrame(apply); }
  }, {passive:true});
  apply();
})();

/* ------------------------------------------------------------------
   reveal hook — content starts visible and settles in once
------------------------------------------------------------------ */
function useReveal(threshold){
  var ref = useRef(null);
  var init = REDUCED || !('IntersectionObserver' in window);
  var s = useState(init), on = s[0], setOn = s[1];
  useEffect(function(){
    if (on) return;
    var el = ref.current; if (!el) return;
    var r = el.getBoundingClientRect();
    if (r.top < window.innerHeight * 0.92){ var t = setTimeout(function(){ setOn(true); }, 60); return function(){ clearTimeout(t); }; }
    var io = new IntersectionObserver(function(es){
      for (var i=0;i<es.length;i++){ if (es[i].isIntersecting){ setOn(true); io.disconnect(); return; } }
    }, { rootMargin:'0px 0px -10% 0px', threshold: threshold || 0.15 });
    io.observe(el);
    return function(){ io.disconnect(); };
  }, [on]);
  return [ref, on];
}


/* ==================================================================

================================================================== */

    <g mask="url(#ivStripes-07)" fill="var(--iv-red, #B22234)"
       font-family="Poppins, system-ui, sans-serif" font-size="120" font-weight="800"
       lengthAdjust="spacingAndGlyphs">
      <text x="352" y="108" textLength="86">V</text>
      <text x="452" y="108" textLength="74">E</text>
      <text x="540" y="108" textLength="76">T</text>
    </g>
    <g clip-path="url(#ivV-07)">
      <rect x="352" y="14" width="43" height="100" fill="var(--iv-arm, #14245C)"></rect>
    </g>
    <polygon fill="#ffffff" points="371,29 375.40,39.95 387.17,40.75 378.11,48.31 380.99,59.75

function Star(){
  return html`<svg class="star" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><polygon points="10,1 12.35,7.1 19,7.4 13.8,11.6 15.6,18 10,14.4 4.4,18 6.2,11.6 1,7.4 7.65,7.1"></polygon></svg>`;
}

/* ==================================================================
   THE COIN — three.js. The extruded V, struck into a disc,
   lit in a pale studio so it reads on a light page.
================================================================== */
var CoinRig = (function(){
  var api = { drag: function(){}, release: function(){}, grab: function(){}, nudge: function(){}, ok:false };
  var canvas = document.getElementById('coin-layer');
  if (!canvas) return api;

  /* fade the coin out as the hero scrolls away; the tinted sections cover it anyway */
  function heroFade(y){
    var f = Math.min(1, y / Math.max(320, window.innerHeight * 0.9));
    return 1 - f;
  }

  /* ---- procedural light studio (6 canvases -> cube map) ---- */
  function envFace(kind){
    var c = document.createElement('canvas'); c.width = 128; c.height = 128;
    var x = c.getContext('2d');
    x.fillStyle = '#dfe6f2'; x.fillRect(0,0,128,128);
    if (kind === 'py'){                       // ceiling: big white softbox
      var g = x.createRadialGradient(44, 40, 4, 44, 40, 96);
      g.addColorStop(0, '#ffffff'); g.addColorStop(.35, '#f4f7fc');
      g.addColorStop(.7, '#d2dbeb'); g.addColorStop(1, '#bcc8de');
      x.fillStyle = g; x.fillRect(0,0,128,128);
    } else if (kind === 'ny'){                // floor: pale table, slightly darker for edge contrast
      var g2 = x.createRadialGradient(64, 64, 6, 64, 64, 90);
      g2.addColorStop(0, '#c9d3e6'); g2.addColorStop(1, '#93a2c0');
      x.fillStyle = g2; x.fillRect(0,0,128,128);
    } else {                                   // walls: pale grey-blue with a white strip light
      x.fillStyle = '#d3dcec'; x.fillRect(0,0,128,128);
      var s = x.createLinearGradient(0,0,128,0);
      s.addColorStop(0, 'rgba(255,255,255,0)');
      s.addColorStop(kind === 'pz' ? .34 : .62, 'rgba(255,255,255,.95)');
      s.addColorStop(kind === 'pz' ? .46 : .74, 'rgba(255,255,255,0)');
      s.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = s; x.fillRect(0, 10, 128, 76);
      var t = x.createLinearGradient(0,0,0,128);
      t.addColorStop(0,'rgba(255,255,255,.45)'); t.addColorStop(1,'rgba(120,138,176,.25)');
      x.fillStyle = t; x.fillRect(0,0,128,128);
    }
    return c;
  }

  /* ---- guilloche, used as a bump map on the face ---- */
  function faceBump(){
    var S = 1024;
    var c = document.createElement('canvas'); c.width = S; c.height = S;
    var x = c.getContext('2d');
    x.fillStyle = '#808080'; x.fillRect(0,0,S,S);
    var cx = S/2, cy = S/2;
    for (var r = 120; r < 500; r += 4){
      x.beginPath(); x.arc(cx, cy, r, 0, Math.PI*2);
      x.strokeStyle = (r % 8 === 0) ? 'rgba(60,60,60,.5)' : 'rgba(180,180,180,.35)';
      x.lineWidth = 1.1; x.stroke();
    }
    for (var i=0;i<240;i++){
      var a = i/240*Math.PI*2;
      x.beginPath();
      x.moveTo(cx + Math.cos(a)*250, cy + Math.sin(a)*250);
      x.lineTo(cx + Math.cos(a)*318, cy + Math.sin(a)*318);
      x.strokeStyle = 'rgba(96,96,96,.5)'; x.lineWidth = 1; x.stroke();
    }
    for (var k=0;k<120;k++){
      var a3 = k/120*Math.PI*2;
      x.beginPath(); x.arc(cx + Math.cos(a3)*345, cy + Math.sin(a3)*345, 2.6, 0, Math.PI*2);
      x.fillStyle = '#4a4a4a'; x.fill();
      x.beginPath(); x.arc(cx + Math.cos(a3)*352, cy + Math.sin(a3)*352, 1.6, 0, Math.PI*2);
      x.fillStyle = '#c8c8c8'; x.fill();
    }
    for (var m=0;m<2;m++){
      x.beginPath(); x.arc(cx, cy, 462 + m*10, 0, Math.PI*2);
      x.strokeStyle = m ? 'rgba(200,200,200,.6)' : 'rgba(56,56,56,.7)';
      x.lineWidth = 3; x.stroke();
    }
    return c;
  }

  /* ---- the seal artwork: rope border, lettered band, star arc, laurels, ribbon.
         Drawn on a plane decal so lettering can never come out mirrored. ---- */
  function sealArt(withV){
    var S = 2048, U = S/2, TAU = Math.PI*2;
    var c = document.createElement('canvas'); c.width = S; c.height = S;
    var x = c.getContext('2d');
    x.translate(U, U);
    function disc(r, fill){ x.beginPath(); x.arc(0,0,r*U,0,TAU); x.fillStyle = fill; x.fill(); }
    function star(cx, cy, ro, fill){
      x.beginPath();
      for (var i=0;i<10;i++){
        var r = (i % 2 ? ro*0.42 : ro), a = -Math.PI/2 + i*Math.PI/5;
        var px = cx + Math.cos(a)*r, py = cy + Math.sin(a)*r;
        if (i) x.lineTo(px, py); else x.moveTo(px, py);
      }
      x.closePath(); x.fillStyle = fill; x.fill();
    }
    function arcText(text, r, size, center, upright, spacing){
      x.font = '700 ' + Math.round(size*U) + 'px "Zilla Slab", Georgia, serif';
      x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#14245C';
      var R = r*U, gap = spacing*U, widths = [], total = 0, j;
      for (j=0;j<text.length;j++){ widths[j] = x.measureText(text[j]).width + gap; total += widths[j]; }
      var dir = upright ? 1 : -1, ang = center - dir*(total/R)/2;
      for (j=0;j<text.length;j++){
        var a = ang + dir*(widths[j]/2)/R;
        x.save(); x.translate(Math.cos(a)*R, Math.sin(a)*R);
        x.rotate(a + dir*Math.PI/2);
        x.fillText(text[j], 0, 0);
        x.restore();
        ang += dir*widths[j]/R;
      }
    }

    /* rope border */
    disc(0.898, '#7C8AA8');
    for (var i=0;i<168;i++){
      x.save(); x.rotate(i/168*TAU); x.translate(0.877*U, 0); x.rotate(0.7);
      x.beginPath(); x.ellipse(0, 0, 0.0105*U, 0.027*U, 0, 0, TAU);
      x.fillStyle = '#EEF2F9'; x.fill(); x.restore();
    }
    /* lettered band */
    disc(0.858, '#B22234'); disc(0.848, '#F8F9FC');
    disc(0.668, '#B22234'); disc(0.658, '#14245C');
    var g = x.createRadialGradient(0, -0.18*U, 0.05*U, 0, 0, 0.66*U);
    g.addColorStop(0, '#24397A'); g.addColorStop(1, '#14245C');
    disc(0.656, g);
    arcText('INNOVET USA', 0.756, 0.112, -Math.PI/2, true, 0.022);
    arcText('VETERAN FOUNDED · DOVER, DELAWARE', 0.762, 0.07, Math.PI/2, false, 0.006);
    star(-0.757*U, 0, 0.042*U, '#B22234');
    star( 0.757*U, 0, 0.042*U, '#B22234');

    /* arc of thirteen stars above the V */
    for (var k=0;k<13;k++){
      var a = -Math.PI/2 + (k-6) * (Math.PI*0.68/12);
      star(Math.cos(a)*0.565*U, Math.sin(a)*0.565*U, 0.03*U, '#FFFFFF');
    }

    /* laurel branches */
    [-1, 1].forEach(function(side){
      x.strokeStyle = '#DCE2EE'; x.lineWidth = 0.008*U;
      x.beginPath();
      x.arc(0, 0, 0.52*U, side > 0 ? -0.26 : Math.PI + 0.26, side > 0 ? 1.28 : Math.PI - 1.28, side < 0);
      x.stroke();
      for (var n=0;n<11;n++){
        var t = n/10, a = side > 0 ? (-0.22 + t*1.46) : (Math.PI + 0.22 - t*1.46);
        [-1, 1].forEach(function(off){
          x.save();
          x.translate(Math.cos(a)*(0.52 + off*0.03)*U, Math.sin(a)*(0.52 + off*0.03)*U);
          x.rotate(a + Math.PI/2 + off*0.55*side);
          x.beginPath(); x.ellipse(0, 0, 0.012*U, 0.03*U, 0, 0, TAU);
          x.fillStyle = '#DCE2EE'; x.fill(); x.restore();
        });
      }
    });

    /* ribbon */
    var rw = 0.23*U, rh = 0.05*U, ry = 0.47*U;
    x.beginPath();
    x.moveTo(-rw - 0.05*U, ry - rh*0.6); x.lineTo(-rw, ry - rh); x.lineTo(rw, ry - rh); x.lineTo(rw + 0.05*U, ry - rh*0.6);
    x.lineTo(rw + 0.02*U, ry); x.lineTo(rw + 0.05*U, ry + rh*0.6); x.lineTo(rw, ry + rh); x.lineTo(-rw, ry + rh);
    x.lineTo(-rw - 0.05*U, ry + rh*0.6); x.lineTo(-rw - 0.02*U, ry); x.closePath();
    x.fillStyle = '#B22234'; x.fill();
    x.lineWidth = 0.005*U; x.strokeStyle = '#F8F9FC'; x.stroke();
    x.font = '700 ' + Math.round(0.058*U) + 'px "Zilla Slab", Georgia, serif';
    x.fillStyle = '#FFFFFF'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('DMAP', 0, ry + 0.004*U);

    /* a flat V for the back face and the 2D fallback */
    if (withV){
      var sc = 0.72*U, oy = -0.06;
      function pt(px, py){ return [px*sc, -(py + oy/0.72)*sc]; }
      function poly(pts, fill){ x.beginPath(); pts.forEach(function(p, i){ var q = pt(p[0], p[1]); if (i) x.lineTo(q[0], q[1]); else x.moveTo(q[0], q[1]); }); x.closePath(); x.fillStyle = fill; x.fill(); }
      poly([[-0.40,0.42],[0,-0.44],[0,-0.12],[-0.22,0.42]], '#2E4E8C');
      poly([[0.40,0.42],[0.22,0.42],[0,-0.12],[0,-0.44]], '#B22234');
      [0.30, 0.207, 0.114].forEach(function(by){
        var outer = 0.40 * ((by - 0.016) + 0.44) / 0.86, inner = 0.22 * ((by + 0.016) + 0.12) / 0.54;
        poly([[inner, by + 0.0155],[outer, by + 0.0155],[outer, by - 0.0155],[inner, by - 0.0155]], '#F8F9FC');
      });
      var sp = pt(-0.249, 0.28);
      star(sp[0], sp[1], 0.075*sc, '#FFFFFF');
    }
    return c;
  }

  var renderer, scene, camera, coinGroup, coinInner, raf = 0, disposed = false;
  var pool = [];
  function track(o){ pool.push(o); return o; }

  try {
    if (!window.THREE) throw new Error('no three');
    var gl = canvas.getContext('webgl', {alpha:true, antialias:true}) || canvas.getContext('experimental-webgl', {alpha:true, antialias:true});
    if (!gl) throw new Error('no webgl');

    renderer = new THREE.WebGLRenderer({ canvas: canvas, context: gl, alpha:true, antialias:true, powerPreference:'high-performance' });
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.9;

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(30, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 4.3);

    var env = new THREE.CubeTexture([envFace('px'),envFace('nx'),envFace('py'),envFace('ny'),envFace('pz'),envFace('nz')]);
    env.needsUpdate = true;
    env.encoding = THREE.sRGBEncoding;
    track(env);

    var bumpTex = new THREE.CanvasTexture(faceBump());
    bumpTex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 4);
    track(bumpTex);

    /* deep navy body + face so the coin holds its edge on a pale page */
    var M = {
      body: new THREE.MeshStandardMaterial({ color:0x14245C, metalness:.55, roughness:.38, envMap:env, envMapIntensity:.45 }),
      face: new THREE.MeshStandardMaterial({ color:0x14245C, metalness:.5, roughness:.42, envMap:env, envMapIntensity:.4, bumpMap:bumpTex, bumpScale:.0055 }),
      nickel: new THREE.MeshStandardMaterial({ color:0xE2E7F1, metalness:1.0, roughness:.2, envMap:env, envMapIntensity:1.15 }),
      anod: new THREE.MeshStandardMaterial({ color:0x2E4E8C, metalness:.45, roughness:.4, envMap:env, envMapIntensity:.45 }),
      enamel: new THREE.MeshStandardMaterial({ color:0xB22234, metalness:.08, roughness:.35, envMap:env, envMapIntensity:.25 })
    };
    for (var key in M){ M[key].color.convertSRGBToLinear(); track(M[key]); }

    var R = 1.0, T = 0.17;

    var disc = new THREE.CylinderGeometry(R, R, T, 240, 1, false);
    (function reed(g){
      var pos = g.attributes.position, N = 92, amp = 0.0;
      for (var i=0;i<pos.count;i++){
        var vx = pos.getX(i), vz = pos.getZ(i);
        var rr = Math.sqrt(vx*vx + vz*vz);
        if (rr > R * 0.992){
          var a = Math.atan2(vz, vx);
          var k = 1 + amp * Math.cos(a * N);
          pos.setX(i, Math.cos(a) * R * k);
          pos.setZ(i, Math.sin(a) * R * k);
        }
      }
      pos.needsUpdate = true;
      g.computeVertexNormals();
    })(disc);
    track(disc);
    var discMesh = new THREE.Mesh(disc, [M.body, M.face, M.face]);
    discMesh.rotation.x = Math.PI/2;

    coinInner = new THREE.Group();
    coinInner.add(discMesh);

    var ringShape = new THREE.Shape();
    ringShape.absarc(0,0,0.965,0,Math.PI*2,false);
    var ringHole = new THREE.Path();
    ringHole.absarc(0,0,0.895,0,Math.PI*2,true);
    ringShape.holes.push(ringHole);
    var ringGeo = new THREE.ExtrudeGeometry(ringShape, { depth:0.028, bevelEnabled:true, bevelThickness:0.008, bevelSize:0.008, bevelSegments:2, curveSegments:96 });
    track(ringGeo);
    var ring = new THREE.Mesh(ringGeo, M.nickel);
    ring.position.z = T/2 - 0.004;
    coinInner.add(ring);

    var legendTex = track(new THREE.CanvasTexture(sealArt(false)));
    legendTex.encoding = THREE.sRGBEncoding;
    legendTex.anisotropy = bumpTex.anisotropy;
    var legendMat = track(new THREE.MeshStandardMaterial({
      map: legendTex, transparent: true, metalness: .18, roughness: .5,
      envMap: env, envMapIntensity: .3, depthWrite: false,
      polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2
    }));
    var legendGeo = track(new THREE.PlaneGeometry(2, 2));
    var legend = new THREE.Mesh(legendGeo, legendMat);
    legend.position.z = T/2 + 0.006;
    legend.renderOrder = 2;
    coinInner.add(legend);
    var backTex = track(new THREE.CanvasTexture(sealArt(true)));
    backTex.encoding = THREE.sRGBEncoding;
    backTex.anisotropy = bumpTex.anisotropy;
    var backMat = track(legendMat.clone()); backMat.map = backTex;
    var back = new THREE.Mesh(legendGeo, backMat);
    back.rotation.y = Math.PI;
    back.position.z = -(T/2 + 0.006);
    back.renderOrder = 2;
    coinInner.add(back);

    /* inner raised bead ring framing the field */
    var innerShape = new THREE.Shape();
    innerShape.absarc(0,0,0.668,0,Math.PI*2,false);
    var innerHole = new THREE.Path();
    innerHole.absarc(0,0,0.652,0,Math.PI*2,true);
    innerShape.holes.push(innerHole);
    var innerGeo = track(new THREE.ExtrudeGeometry(innerShape, { depth:0.014, bevelEnabled:true, bevelThickness:0.004, bevelSize:0.004, bevelSegments:2, curveSegments:96 }));
    var innerRing = new THREE.Mesh(innerGeo, M.nickel);
    innerRing.position.z = T/2 - 0.002;
    coinInner.add(innerRing);

    if (document.fonts && document.fonts.ready && document.fonts.ready.then){
      document.fonts.ready.then(function(){
        try {
          legendTex.image = sealArt(false); legendTex.needsUpdate = true;
          backTex.image = sealArt(true); backTex.needsUpdate = true;
        } catch(e){}
      });
    }

    var TLo=[-0.40,0.42], TLi=[-0.22,0.42], Pin=[0,-0.12], Pout=[0,-0.44];
    function quad(pts){
      var s = new THREE.Shape();
      s.moveTo(pts[0][0], pts[0][1]);
      for (var i=1;i<pts.length;i++) s.lineTo(pts[i][0], pts[i][1]);
      s.closePath();
      return s;
    }
    var leftShape = quad([TLo, Pout, Pin, TLi]);
    (function(){
      var sp = new THREE.Path();
      var scx = -0.249, scy = 0.28, ro = 0.075, ri = 0.031;
      for (var i=9;i>=0;i--){
        var r = (i % 2 === 0) ? ro : ri;
        var a = -Math.PI/2 + i * Math.PI/5;
        var px = scx + Math.cos(a)*r, py = scy + Math.sin(a)*r;
        if (i === 9) sp.moveTo(px, py); else sp.lineTo(px, py);
      }
      sp.closePath();
      leftShape.holes.push(sp);
    })();
    var rightShape = quad([[0.40,0.42], [0.22,0.42], Pin, Pout]);

    var exOpt = { depth:0.058, bevelEnabled:true, bevelThickness:0.013, bevelSize:0.013, bevelSegments:2, curveSegments:8 };
    var leftGeo = track(new THREE.ExtrudeGeometry(leftShape, exOpt));
    var rightGeo = track(new THREE.ExtrudeGeometry(rightShape, exOpt));
    var leftArm = new THREE.Mesh(leftGeo, M.anod);
    var rightArm = new THREE.Mesh(rightGeo, M.enamel);
    var reliefZ = T/2 - 0.006;
    leftArm.position.z = reliefZ; rightArm.position.z = reliefZ;
    var vGroup = new THREE.Group();
    vGroup.scale.set(0.72, 0.72, 1);
    vGroup.position.y = 0.06;
    vGroup.add(leftArm); vGroup.add(rightArm);
    coinInner.add(vGroup);

    var barGeo = track(new THREE.BoxGeometry(1, 0.031, 0.026));
    [0.30, 0.207, 0.114].forEach(function(by){
      var outer = 0.40 * ((by - 0.016) + 0.44) / 0.86;
      var inner = 0.22 * ((by + 0.016) + 0.12) / 0.54;
      var a = inner + 0.018, b = outer - 0.018;
      if (b <= a) return;
      var bar = new THREE.Mesh(barGeo, M.nickel);
      bar.scale.x = (b - a);
      bar.position.set((a + b)/2, by, reliefZ + 0.076);
      vGroup.add(bar);
    });

    coinGroup = new THREE.Group();
    coinGroup.add(coinInner);
    scene.add(coinGroup);

    /* --- lights: a white key, a pale-blue rim, a faint red kicker, soft ambient --- */
    var key = new THREE.DirectionalLight(0xFFFFFF, 2.0);
    key.position.set(-3.1, 3.6, 3.0);
    scene.add(key);
    var rim = new THREE.DirectionalLight(0xA9C0EC, 0.8);
    rim.position.set(3.4, -1.4, -2.2);
    scene.add(rim);
    var fill = new THREE.DirectionalLight(0xE8A0A8, 0.22);
    fill.position.set(2.2, -2.6, 1.6);
    scene.add(fill);
    scene.add(new THREE.AmbientLight(0xEEF2FA, 0.32));

    var wide = false, baseScale = 1;
    function layout(){
      var w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, w < 760 ? 1.7 : 2));
      camera.aspect = w/h; camera.updateProjectionMatrix();
      wide = w >= 900;
      baseScale = wide ? Math.min(1.12, Math.max(0.84, w/1500)) : Math.min(0.9, Math.min(w * 0.72, 300) / (h * 0.87));
      coinGroup.position.x = wide ? (camera.position.z * Math.tan(15*Math.PI/180) * camera.aspect) * 0.46 : 0;
      coinGroup.position.y = wide ? 0.02 : Math.max(0, (h/2 - 64 - Math.min(340, Math.max(250, h*.4))/2) / h * 2.3);
      var sp = !wide && document.querySelector('.spin');
      if (sp){
        var r = sp.getBoundingClientRect();
        if (r.width > 0){
          baseScale = r.width / (h * 0.87);
          coinGroup.position.y = (h/2 - (r.top + window.pageYOffset + r.height/2)) / h * 2.3;
        }
      }
    }
    layout();
    setTimeout(layout, 300);
    window.addEventListener('load', layout);
    window.addEventListener('resize', layout, {passive:true});

    var spin = -0.35, spinTarget = -0.35, vel = 0, dragging = false, lastPX = 0;
    var t0 = performance.now(), strikeT = REDUCED ? 1 : 0;
    /* idle motion runs for at most IDLE_MS after load or the last interaction (WCAG 2.2.2) */
    var IDLE_MS = 5000, idleUntil = t0 + 950 + IDLE_MS, idleClock = 0, lastNow = t0;
    var scrollY = 0, alpha = 1;
    var unsub = Scroll.sub(function(y){
      scrollY = y;
      alpha = heroFade(y);
      canvas.style.opacity = alpha.toFixed(3);
    });

    function rearm(){ idleUntil = performance.now() + IDLE_MS; }
    api.grab = function(px){ dragging = true; lastPX = px; vel = 0; rearm(); };
    api.drag = function(px){
      if (!dragging) return;
      var d = (px - lastPX) / Math.max(320, window.innerWidth * 0.42);
      lastPX = px;
      spin += d * 3.4; vel = d * 3.4;
    };
    api.release = function(){ dragging = false; rearm(); };
    api.nudge = function(dir){ vel += dir * 0.09; rearm(); };
    api.ok = true;

    var visible = true;
    document.addEventListener('visibilitychange', function(){ visible = !document.hidden; });

    function frame(now){
      raf = requestAnimationFrame(frame);
      if (!visible || alpha < 0.01) return;   // nothing to draw once the hero is gone
      var el = now - t0;
      var idling = !REDUCED && now < idleUntil;
      if (idling) idleClock += Math.min(64, now - lastNow);
      lastNow = now;

      if (strikeT < 1){
        strikeT = Math.min(1, el / 950);
        var e = 1 - Math.pow(1 - strikeT, 3);
        var d = Math.exp(-9 * strikeT) * Math.sin(20 * strikeT);
        coinGroup.scale.setScalar(baseScale * (1.42 - 0.42 * e + d * 0.035));
        coinGroup.position.z = (1.5 - 1.5 * e) + d * 0.09;
        coinInner.rotation.x = -0.95 * (1 - e) - 0.2 + d * 0.07;
      } else {
        coinGroup.scale.setScalar(baseScale);
        coinGroup.position.z = 0;
        if (!REDUCED){
          coinInner.rotation.x = -0.2 + Math.sin(idleClock * 0.00042) * 0.055;
          coinInner.rotation.z = Math.sin(idleClock * 0.00031 + 1.2) * 0.04;
        } else {
          coinInner.rotation.x = -0.2;
        }
      }

      /* scrolling through the hero turns the coin; idles slowly; drag spins freely */
      var scrollSpin = -(scrollY / Math.max(1, window.innerHeight)) * Math.PI * 1.2;
      if (!dragging){
        spin += vel;
        vel *= 0.955;
        if (idling) spin += 0.0016;
      }
      spinTarget = scrollSpin + spin;
      coinGroup.rotation.y += (spinTarget - coinGroup.rotation.y) * (dragging ? 0.55 : 0.085);

      if (!REDUCED){
        key.position.x += ((-3.1 + (Light.x - 0.5) * 3.6) - key.position.x) * 0.06;
        key.position.y += (( 3.6 - (Light.y - 0.5) * 3.2) - key.position.y) * 0.06;
      }

      renderer.render(scene, camera);
    }
    raf = requestAnimationFrame(frame);

    window.addEventListener('pagehide', function(){
      if (disposed) return; disposed = true;
      cancelAnimationFrame(raf); unsub();
      pool.forEach(function(o){ if (o && o.dispose) o.dispose(); });
      renderer.dispose();
    });

  } catch (err) {
    /* ---------- Canvas-2D fallback coin, same palette, soft shadow for a light page ---------- */
    try {
      var ctx = canvas.getContext('2d');
      var dpr2 = Math.min(window.devicePixelRatio || 1, 2);
      var W = 0, H = 0;
      function size(){
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = W*dpr2; canvas.height = H*dpr2;
        ctx.setTransform(dpr2,0,0,dpr2,0,0);
      }
      size(); window.addEventListener('resize', size, {passive:true});
      var ang = 0, y2 = 0, vel2 = 0, drag2 = false, lpx = 0, a2 = 1;
      var idleUntil2 = performance.now() + 5000;
      function rearm2(){ idleUntil2 = performance.now() + 5000; }
      var sealFallback = sealArt(true);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ sealFallback = sealArt(true); });
      Scroll.sub(function(y){ y2 = y; a2 = heroFade(y); canvas.style.opacity = a2.toFixed(3); });
      api.grab = function(px){ drag2 = true; lpx = px; rearm2(); };
      api.drag = function(px){ if(!drag2) return; var d=(px-lpx)/240; lpx=px; ang += d*3; vel2 = d*3; };
      api.release = function(){ drag2 = false; rearm2(); };
      api.nudge = function(d){ vel2 += d*0.08; rearm2(); };
      api.ok = true;
      (function loop(){
        requestAnimationFrame(loop);
        if (document.hidden || a2 < 0.01) return;
        ctx.clearRect(0,0,W,H);
        var wide2 = W >= 900;
        var cx = wide2 ? W*0.72 : W*0.5, cy = wide2 ? H*0.5 : H*0.36;
        var R2 = Math.min(W,H) * (wide2 ? 0.19 : 0.17);
        if (!drag2){ ang += vel2; vel2 *= 0.955; if(!REDUCED && performance.now() < idleUntil2) ang += 0.004; }
        var a = ang - (y2/Math.max(1,H)) * Math.PI * 1.2;
        var sx = Math.cos(a);
        ctx.save(); ctx.translate(cx, cy); ctx.scale(Math.max(0.06, Math.abs(sx)), 1);
        var g = ctx.createRadialGradient(-R2*0.42, -R2*0.5, R2*0.1, 0, 0, R2*1.25);
        g.addColorStop(0,'#6F88C2'); g.addColorStop(.35,'#2E4E8C'); g.addColorStop(.72,'#1A2D66'); g.addColorStop(1,'#14245C');
        ctx.shadowColor = 'rgba(20,36,92,.28)'; ctx.shadowBlur = 34; ctx.shadowOffsetY = 18;
        ctx.beginPath(); ctx.arc(0,0,R2,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
        ctx.shadowColor = 'rgba(0,0,0,0)'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
        ctx.lineWidth = Math.max(2, R2*0.05); ctx.strokeStyle='#E2E7F1'; ctx.stroke();
        ctx.drawImage(sealFallback, -R2*0.97, -R2*0.97, R2*1.94, R2*1.94);
        ctx.restore();
      })();
    } catch(e2){ canvas.style.display = 'none'; }
  }
  return api;
})();
